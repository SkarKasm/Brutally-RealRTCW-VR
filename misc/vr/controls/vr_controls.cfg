// Brutally RealRTCW VR - controller buttons
//
// Edit this file to move actions to other buttons (Pico, Vive, Index, PSVR2,
// Steam Frame, Windows MR ...). It is read every time the game starts; you can
// also type the same lines in the console to try a change straight away.
//
// Button names are the Quest Touch ones for a right handed player. "R" is the
// hand holding the gun, "L" the other one (vr_rightHanded 0 swaps them):
//
//   A  B      gun hand, lower / upper face button
//   X  Y      other hand, lower / upper face button
//   RTRIG  LTRIG      triggers
//   RGRIP  LGRIP      grips
//   RCLICK LCLICK     thumbstick clicks
//   RUP RDOWN RLEFT RRIGHT     gun hand stick pushed that way
//   LUP LDOWN LLEFT LRIGHT     other hand stick pushed that way
//   G+<button>        only while the gun hand grip is held
//   none              nothing
//
// Several buttons for one action go in the same quotes: "B Y".
// On controllers without A/B/X/Y (Vive wands) the runtime maps the trackpad
// and menu buttons onto them; SteamVR's own binding screen can move them too.
//
// The default layout is RTCWQuest's.
//
// Not remappable here: trigger fires (both triggers with two guns), other hand
// trigger sprints (the other hand grip with two guns), gun hand grip tap =
// reload / drop magazine, gun hand grip hold = weapon wheel (move the gun hand
// towards a weapon or tilt the right stick, let go of the grip or pull the
// trigger), other hand grip double press = a second pistol / SMG or back to one,
// left stick walks, right stick left/right turns, left menu button = game menu.
// Ladders: walk into them and look up or down, like the flat game.

set vr_bind_jump      "B"         // jump (also stands you up)
set vr_bind_crouch    "A"         // crouch while held
set vr_bind_stand     "none"      // stand back up
set vr_bind_use       "RCLICK"    // open doors, pull levers, pick things up
set vr_bind_reload    "none"      // reload (the gun hand grip tap reloads anyway). Two guns: both hands down at the waist first
set vr_bind_weapnext  "RDOWN"     // next weapon
set vr_bind_weapprev  "RUP"       // previous weapon
set vr_bind_kick      "LCLICK"    // kick
set vr_bind_notebook  "Y"         // notebook
set vr_bind_hud       "G+A"       // show / hide the HUD
set vr_bind_useitem   "G+X"       // use the selected item
set vr_bind_itemnext  "G+B"       // next item
set vr_bind_altfire   "X"         // alternate fire mode / scope
